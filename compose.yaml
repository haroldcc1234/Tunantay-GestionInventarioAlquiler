name: tunantay

x-backend: &backend
  build: ./services
  restart: unless-stopped
  env_file: .env
  networks: [private]
  depends_on:
    mysql-db:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 20s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  mysql-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
      TZ: America/Lima
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks: [private]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping --silent -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 35s

  auth-service:
    <<: *backend
    environment:
      SERVICE_NAME: auth
      DB_USER: svc_auth
      DB_NAME: auth_db

  inventory-service:
    <<: *backend
    environment:
      SERVICE_NAME: inventory
      DB_USER: svc_inventory
      DB_NAME: inventory_db

  rental-service:
    <<: *backend
    environment:
      SERVICE_NAME: rental
      DB_USER: svc_rental
      DB_NAME: rental_db

  returns-service:
    <<: *backend
    environment:
      SERVICE_NAME: returns
      DB_USER: svc_returns
      DB_NAME: returns_db

  admin-service:
    <<: *backend
    environment:
      SERVICE_NAME: admin
      DB_USER: svc_admin
      DB_NAME: admin_db

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [private]

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private]
    depends_on:
      - frontend
      - auth-service
      - inventory-service
      - rental-service
      - returns-service
      - admin-service

networks:
  private:
    driver: bridge

volumes:
  mysql_data:
