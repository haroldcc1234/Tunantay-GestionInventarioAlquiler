server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;

    location /api/auth/ {
        set $backend "auth-service:3000";
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /api/inventory/ {
        set $backend "inventory-service:3000";
        rewrite ^/api/inventory/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /api/rental/ {
        set $backend "rental-service:3000";
        rewrite ^/api/rental/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /api/returns/ {
        set $backend "returns-service:3000";
        rewrite ^/api/returns/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /api/admin/ {
        set $backend "admin-service:3000";
        rewrite ^/api/admin/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location / {
        set $web "frontend:80";
        proxy_pass http://$web;
    }
}
